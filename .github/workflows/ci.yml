name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/holt-client-test.txt
      - run: python -m unittest discover -s tests -p "test_holt_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests -p "test_st_mcp_patch.py" -v
      - run: python -m unittest discover -s tests -p "test_st_retrieval_patch.py" -v
      - run: python -m pip install -r requirements/pocket-test.txt
      - run: python -m unittest discover -s tests -p "test_pocket_service.py" -v
      - run: npm install --prefix .local/holt/schema-validator jsonschema@1.5.0 --ignore-scripts --no-audit --no-fund
      - run: node --test tests/st_voice.test.cjs tests/st_tool_schema.test.cjs tests/st_mcp_images.test.cjs tests/st_mcp_validator.test.cjs tests/st_pocket.test.cjs
